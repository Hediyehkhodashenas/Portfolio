<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Hediyeh Khodashenas</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
  <style>
    :root { --paper:#F2ECE2; --ink:#1D1915; --ink-2:#554B42; --accent:#A4462A; --rule:rgba(29,25,21,.85); }
    @media (prefers-color-scheme: dark) { :root { --paper:#15120F; --ink:#EEE6D9; --ink-2:#BDB2A3; --accent:#E08A62; --rule:rgba(238,230,217,.8); } }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Instrument Sans", system-ui, sans-serif;
      display:flex; align-items:center; padding:clamp(1.25rem,5vw,4rem); -webkit-font-smoothing:antialiased; }
    main { max-width:56rem; width:100%; }
    .code { font-size:.75rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-2); margin:0 0 1.5rem; }
    h1 { font-family:"Instrument Serif", Georgia, serif; font-weight:400; font-size:clamp(3rem,10vw,8rem);
      line-height:.92; letter-spacing:-.035em; margin:0; }
    h1 em { color:var(--accent); }
    p.lede { margin:2rem 0 0; padding-top:1.25rem; border-top:1px solid var(--rule); color:var(--ink-2); max-width:40ch; line-height:1.6; }
    a { color:var(--ink); text-underline-offset:.2em; text-decoration-thickness:1px; }
    a:hover { color:var(--accent); }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>This page has <em>wandered off.</em></h1>
    <p class="lede">The address may have changed. <a id="home" href="./">Return to the portfolio</a>.</p>
  </main>
  <script>
    // Resolve the site root for both custom domains and GitHub project pages (user.github.io/repo/).
    (function () {
      var a = document.getElementById("home");
      var seg = location.pathname.split("/").filter(Boolean)[0];
      var isProjectPages = /\.github\.io$/i.test(location.hostname) && seg;
      a.href = isProjectPages ? "/" + seg + "/" : "/";
    })();
  </script>
</body>
</html>
